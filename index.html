<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1A30">
<title>Pearl Of Pacific Contest — En direct</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Mise en page : une colonne de telephone, cartes empilees, barre de navigation fixe en bas. Look unique, sombre, aux couleurs POPC. */
:root{
  color-scheme: dark;
  --bg:#0B1A30; --panel:#12294A; --panel2:#1B3558; --line:#1E3A63; --hl:#24406B;
  --fg:#FFFFFF; --mut:#A9B8CE; --dim:#7F8FA8;
  --acc:#F5922A; --accfg:#1A1206;
  --ok:#4ADE80; --okbg:#123D2B; --inter:#7DBBF5;
  --warnbg:#3B2A0F; --warnfg:#FFD9A8;
  --or:#F2C230; --argent:#D5DBE5; --bronze:#E0A070;
  --corps:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --chiffre:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--corps);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:10px 96px}

.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px dashed var(--dim);font-size:12px;color:var(--mut)}
.demo select{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 8px;color:var(--fg)}
.entete{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--acc);color:var(--accfg);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.entete .t{flex:1;min-width:0}
.entete .n{font-weight:800;font-size:15px;letter-spacing:.2px;text-transform:uppercase}
.entete .d{font-size:12px;color:var(--mut)}
.maj{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap;background:transparent;border:0;min-height:44px;padding:0 0 0 6px}
.maj i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.maj.off i{background:var(--dim)}
.diag{font-size:12px;gap:6px}
.diag b{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.diag div{overflow-wrap:anywhere}
.diag button{align-self:flex-start;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
@media (prefers-reduced-motion:no-preference){.flash{animation:flash 1s ease}}
@keyframes flash{from{opacity:.45}to{opacity:1}}

.carte{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.carte.serre{padding:0;gap:0;overflow:hidden}
.et{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.rangee{display:flex;align-items:center;gap:8px}
.pousse{flex:1}
h1{margin:0;font-size:22px;font-weight:800;text-wrap:balance}
.sous{font-size:13px;color:var(--mut)}
.num{font-family:var(--chiffre);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.3px}

.bandeau{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--warnbg);border:1px solid var(--acc);color:var(--warnfg);font-size:13px;font-weight:600}
.verrou{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--panel2);font-size:13px;color:var(--mut)}

.moi{background:var(--panel2);border:1.5px solid var(--acc);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.moi .nom{font-size:22px;font-weight:800}
.proch{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.proch .h{font-family:var(--chiffre);font-size:26px;font-weight:700;color:var(--acc);white-space:nowrap}
.proch .x{font-size:13px;line-height:1.35}
.inviter{border:1.5px dashed var(--acc);background:transparent;border-radius:14px;min-height:56px;padding:10px 14px;color:var(--acc);font-weight:700;width:100%;display:flex;align-items:center;gap:10px;text-align:left}

.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.att{background:var(--bg);color:var(--mut)}
.pill.tc{background:var(--warnbg);color:var(--warnfg)}
.cat-INTER{color:var(--inter)} .cat-RX{color:var(--acc)}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;background:var(--acc);color:var(--accfg)}
.badge.INTER{background:var(--inter)}

.couloirs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.couloir{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:var(--panel2);min-width:0}
.couloir b{width:22px;height:22px;border-radius:6px;background:var(--bg);color:var(--mut);font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.couloir span{font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.couloir.moi-c{background:var(--acc);color:var(--accfg)}
.couloir.moi-c b{background:var(--accfg);color:var(--acc)}
.couloir.moi-c span{font-weight:800}

.vague{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-top:1px solid var(--line)}
.vague:first-child{border-top:0}
.vague .h{width:64px;flex:none;font-family:var(--chiffre);font-size:18px;font-weight:700;color:var(--acc);white-space:nowrap}
.vague.finie .h{color:var(--dim)}
.vague .v{font-size:14px;font-weight:600}
.vague .e{font-size:12px;color:var(--mut);line-height:1.4}
.vague.amoi{background:var(--hl)}

.ligne{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border-top:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.ligne:first-child{border-top:0}
.ligne.moi-l{background:var(--hl)}
.pos{width:26px;height:26px;border-radius:7px;background:var(--bg);color:var(--mut);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-variant-numeric:tabular-nums}
.pos.p1{background:var(--or);color:var(--accfg)} .pos.p2{background:var(--argent);color:var(--accfg)} .pos.p3{background:var(--bronze);color:var(--accfg)}
.ligne .nm{flex:1;min-width:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.ligne .pf{font-size:13px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.ligne .pt{width:40px;text-align:right;font-family:var(--chiffre);font-size:19px;font-weight:700}
.ligne .ec{width:40px;text-align:right;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.etoile{flex:none}
.lien{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:13px;font-weight:600;color:var(--acc);background:transparent;border:0;width:100%}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;padding:4px;border-radius:12px;background:var(--panel)}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);font-weight:700}
.seg.doux button[aria-pressed="true"]{background:var(--hl);color:var(--fg)}
.wsel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.wsel button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:600}
.wsel button.encours{border-color:var(--ok);color:var(--ok)}
.wsel button.avenir{background:var(--bg);color:var(--dim)}
.wsel button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:800}
.rech{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.rech input{flex:1;min-width:0;background:transparent;border:0;outline:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.tuile{padding:10px 8px;border-radius:12px;background:var(--panel);text-align:center;min-width:0}
.tuile .g{font-family:var(--chiffre);font-size:26px;font-weight:700;line-height:1.05}
.tuile .l{font-size:11px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{padding:5px 10px;border-radius:8px;background:var(--bg);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.chip.der{background:var(--okbg);color:var(--ok)}
.desc{white-space:pre-wrap;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.retour{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--mut)}
.suivre{min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-weight:700}
.suivre[aria-pressed="true"]{background:var(--panel2)}
.vide{padding:18px 12px;text-align:center;color:var(--mut);font-size:13px}
.note{font-size:12px;color:var(--mut);line-height:1.45}
.fait{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-top:1px solid var(--line)}
.fait:first-child{border-top:0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0E2140;border-top:1px solid var(--line);
  padding:4px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav a{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);text-decoration:none}
nav a[aria-current="page"]{color:var(--acc);font-weight:700}
@media (prefers-reduced-motion:no-preference){.ligne,.seg button,.wsel button{transition:background-color .12s}}
</style>
</head>
<body>

<div id="app"></div>
<nav aria-label="Navigation principale"><div class="in" id="nav"></div></nav>

<script>
var JEUX = /*__JEUX__*/null;
var DEMO = false;
var VERSION = "2.0 · 09/11/2026";

/* ------------------------------------------------------------------ etat */
var D = null;
var S = { tab:"direct", fiche:null, cat:null, sub:"general", wod:null, wmode:null, q:"", fav:null, demo:"wod4" };
function lire(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function ecrire(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function el(id){ return document.getElementById(id); }

/* ------------------------------------------------------------ icones */
var ICO = {
  direct:'<circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>',
  classement:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  wods:'<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>',
  passage:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  plus:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  retour:'<path d="M14.5 5.5L8 12l6.5 6.5"/>',
  loupe:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  cadenas:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
function ico(n,t){ return '<svg aria-hidden="true" width="'+(t||22)+'" height="'+(t||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[n]+'</svg>'; }
function etoile(plein,t){ return '<svg class="etoile" aria-hidden="true" width="'+(t||15)+'" height="'+(t||15)+'" viewBox="0 0 24 24" fill="'+(plein?"var(--acc)":"none")+'" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.9 6.7 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg>'; }

/* ------------------------------------------------------- lecture des donnees */
function aCats(){ return D.cats && D.cats.length>0; }
function equipe(nom){ for(var i=0;i<D.equipes.length;i++){ if(D.equipes[i].nom===nom) return D.equipes[i]; } return null; }
function favori(){ return S.fav ? equipe(S.fav) : null; }
function catActive(){
  if(!aCats()) return "";
  if(S.cat && D.cats.indexOf(S.cat)>=0) return S.cat;
  var f=favori(); if(f && f.cat) return f.cat;
  var v=vagueCourante(); if(v && v.cat) return v.cat;
  return D.cats[0];
}
function equipesDe(cat){ return D.equipes.filter(function(e){ return !aCats() || e.cat===cat; }); }
function apres(cat){ return D.apres[aCats()?cat:""] || 0; }
function ordinal(n){ return n===1 ? "1re" : n+"e"; }
function nonFinies(){ return D.vagues.filter(function(v){ return v.statut!=="Terminée" && v.c.join("")!==""; }); }
function vagueCourante(){ var l=nonFinies(); return l.length?l[0]:null; }
function jourDe(v){ return D.wods[v.wod-1].jour; }
function jourEntame(v){ return D.vagues.some(function(x){ return jourDe(x)===jourDe(v) && (x.statut==="Terminée" || x.statut==="En cours"); }); }
function heure(v){ return (v.prevu?"≈ ":"")+v.heure; }
function retardDuJour(){ var v=vagueCourante(); if(!v) return 0; return (D.retard && D.retard[String(jourDe(v))]) || 0; }
function passageDe(nom){
  var l=nonFinies();
  for(var i=0;i<l.length;i++){ var k=l[i].c.indexOf(nom); if(k>=0) return { v:l[i], couloir:k+1, avant:i }; }
  return null;
}
function resultats(w,cat){
  return equipesDe(cat).filter(function(e){ return e.res[w-1]; })
    .sort(function(a,b){ return a.res[w-1].rang-b.res[w-1].rang || a.nom.localeCompare(b.nom); });
}
function general(cat){
  return equipesDe(cat).filter(function(e){ return e.rang!==null; })
    .sort(function(a,b){ return a.rang-b.rang || a.nom.localeCompare(b.nom); });
}
function wodCourant(){
  var v=vagueCourante(); if(v) return v.wod;
  return D.wods.length;
}
function etatWod(w,cat){ var e=D.wods[w-1].etat; return e[aCats()?cat:""] || "avenir"; }
function sousPli(cat){ return aCats() && D.suspense[cat]; }
/* sous pli : tout WOD joue au-dela du dernier devoile est secret (le fichier ne contient d'ailleurs pas ses resultats) */
function estSecret(w,cat){ return sousPli(cat) && w>apres(cat) && etatWod(w,cat)!=="avenir"; }

/* --------------------------------------------------------- morceaux communs */
function pos(r){ return '<span class="pos'+(r<=3?" p"+r:"")+'">'+r+'</span>'; }
function ligneEquipe(e, rang, droite){
  var moi = S.fav===e.nom;
  return '<button type="button" class="ligne'+(moi?" moi-l":"")+'" data-equipe="'+esc(e.nom)+'">'+pos(rang)+
    '<span class="nm">'+esc(e.nom)+'</span>'+(moi?etoile(true):"")+droite+'</button>';
}
function segCat(){
  if(!aCats()) return "";
  var c=catActive();
  return '<div class="seg" role="group" aria-label="Catégorie">'+D.cats.map(function(k){
    return '<button type="button" data-cat="'+k+'" aria-pressed="'+(k===c)+'">'+k+'</button>'; }).join("")+'</div>';
}
function selWod(sel){
  var c=catActive();
  return '<div class="wsel" role="group" aria-label="Choisir un WOD">'+D.wods.map(function(w){
    var et=etatWod(w.n,c), autre=aCats()?D.cats.some(function(k){ return etatWod(w.n,k)==="encours"; }):false;
    var cl=(et==="encours"||autre)?"encours":(et==="avenir"?"avenir":"");
    return '<button type="button" class="'+cl+'" data-wod="'+w.n+'" aria-pressed="'+(w.n===sel)+'" aria-label="'+esc(w.nom)+'">'+w.n+'</button>';
  }).join("")+'</div>';
}
function bandeauRetard(){
  var r=retardDuJour(); if(!r) return "";
  return '<div class="bandeau" role="status">'+ico("passage",18)+'<span>Retard d\'environ '+r+' min · les heures affichées en tiennent compte</span></div>';
}
function couloirs(v){
  return '<div class="couloirs">'+v.c.map(function(n,i){ if(!n) return "";
    return '<div class="couloir'+(n===S.fav?" moi-c":"")+'"><b>'+(i+1)+'</b><span>'+esc(n)+'</span></div>'; }).join("")+'</div>';
}
function titreVague(v){ return esc(v.nom.replace(/ (RX|INTER)$/,""))+(v.cat?' <span class="cat-'+v.cat+'">'+v.cat+'</span>':""); }
function blocProchain(f){
  var p=passageDe(f.nom); if(!p) return "";
  var txt = p.avant===0 ? (jourEntame(p.v)?"C'est votre vague":"Vous ouvrez la journée")
          : (p.avant===1 ? "Encore 1 vague avant la vôtre" : "Encore "+p.avant+" vagues avant la vôtre");
  return '<div class="proch"><span class="h">'+heure(p.v)+'</span><span class="x"><b>'+txt+'</b><br><span class="sous">'+
    esc(D.wods[p.v.wod-1].nom)+' · '+esc(p.v.nom)+' · Couloir '+p.couloir+(p.v.prevu?' · prévu '+p.v.prevu:'')+'</span></span></div>';
}
function resumeEquipe(e){
  var t=[]; if(e.cat) t.push(e.cat);
  if(e.rang!==null){ t.push(ordinal(e.rang)); t.push(e.total+" pts"); }
  return t.join(" · ");
}

/* ------------------------------------------------------------------ DIRECT */
function vueDirect(){
  var h="", f=favori(), v=vagueCourante(), c;
  h+=bandeauRetard();
  if(f){
    h+='<button type="button" class="moi" data-equipe="'+esc(f.nom)+'"><span class="rangee">'+etoile(true,16)+
       '<span class="et" style="color:var(--acc)">Mon équipe</span><span class="pousse"></span><span class="sous">Voir la fiche ›</span></span>'+
       '<span class="nom">'+esc(f.nom)+'</span><span class="sous">'+esc(resumeEquipe(f))+'</span>'+blocProchain(f)+'</button>';
  } else {
    h+='<button type="button" class="inviter" data-aller="classement">'+etoile(false,20)+'<span>Suivre une équipe<br><span class="sous" style="font-weight:400">Choisissez-la dans le classement : elle sera mise en avant partout.</span></span></button>';
  }
  if(v){
    var enJeu = jourEntame(v), suite = nonFinies().slice(1,3).filter(function(x){ return jourDe(x)===jourDe(v); });
    h+='<section class="carte"><div class="rangee"><span class="et">'+(enJeu?"Sur le plateau":"Prochaine vague")+'</span><span class="pousse"></span>'+
       '<span class="pill '+(enJeu?"ok":"att")+'">'+(enJeu?"Départ ":"Jour "+jourDe(v)+" · ")+heure(v)+'</span></div>'+
       '<div style="font-size:17px;font-weight:700">'+esc(D.wods[v.wod-1].nom)+' · '+titreVague(v)+'</div>'+couloirs(v)+'</section>';
    if(suite.length){
      h+='<section class="carte serre"><div class="et" style="padding:12px 12px 0">Ensuite</div>'+suite.map(function(x){ return ligneVague(x,false); }).join("")+'</section>';
    }
    c = v.cat || catActive();
    var w=v.wod, res=resultats(w,c);
    if(res.length){
      h+='<section class="carte serre"><div class="rangee" style="padding:12px 12px 6px"><span class="et">'+esc(D.wods[w-1].nom)+' · provisoire</span><span class="pousse"></span>'+
         '<span class="sous'+(c?' cat-'+c:'')+'" style="font-weight:600">'+(c?c+' · ':'')+res.length+' / '+equipesDe(c).length+' passées</span></div>'+
         res.slice(0,5).map(function(e){ var r=e.res[w-1]; return ligneEquipe(e,r.rang,'<span class="pf">'+esc(r.perf)+'</span><span class="pt">'+r.pts+'</span>'); }).join("")+
         '<button type="button" class="lien" data-aller="wods" data-wod="'+w+'">Tous les résultats du WOD ›</button></section>';
    }
  } else {
    h+='<section class="carte"><div class="et">Compétition terminée</div><div class="sous">Merci aux équipes, aux juges et aux bénévoles.</div></section>';
  }
  c = catActive();

  }

function route(){
  if(!D){ dessiner(); return; }
  var hsh=(location.hash||"").replace(/^#/,"");
  var m=/^equipe-(\d+)$/.exec(hsh);
  if(m){ var t=D.equipes.filter(function(x){ return String(x.id)===m[1]; })[0]; S.fiche=t?t.nom:null; }
  else { S.fiche=null; if(VUES[hsh]) S.tab=hsh; }
  dessiner(); window.scrollTo(0,0);
}
function aller(h){ if(("#"+h)===location.hash) route(); else location.hash=h; }
function charger(cle){
  S.demo=cle; D=JEUX[cle];
  if(S.fav && !equipe(S.fav)) S.fav=null;
  S.wod=null; S.wmode=null;
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-equipe],[data-cat],[data-sub],[data-wod],[data-wmode],[data-aller],[data-suivre],[data-retour],[data-diag],[data-actualiser]"); if(!b) return;
  var d=b.dataset;
  if(d.diag!==undefined){ L.ouvert=!L.ouvert; dessiner(); return; }
  if(d.actualiser!==undefined){ if(!DEMO) lireSources(true); return; }
  if(d.suivre!==undefined){ S.fav=(S.fav===d.suivre)?null:d.suivre; ecrire("popc.fav",S.fav); dessiner(); return; }
  if(d.retour!==undefined){ if(history.length>1) history.back(); else aller(S.tab); return; }
  if(d.aller!==undefined){ if(d.wod) { S.wod=parseInt(d.wod,10); S.wmode=null; } aller(d.aller); return; }
  if(d.equipe!==undefined){ var e=equipe(d.equipe); if(e) aller("equipe-"+e.id); return; }
  if(d.cat!==undefined){ S.cat=d.cat; ecrire("popc.cat",S.cat); dessiner(); return; }
  if(d.sub!==undefined){ S.sub=d.sub; dessiner(); return; }
  if(d.wmode!==undefined){ S.wmode=d.wmode; dessiner(); return; }
  if(d.wod!==undefined){ S.wod=parseInt(d.wod,10); S.wmode=null; dessiner(); return; }

document.addEventListener("input",function(ev){

/* ============================================================ LECTURE EN LIGNE
   Excel ecrit le fichier sous un nom qui change toutes les 20 secondes
   (live/s0.json a live/s179.json). Cette adresse n'a pas servi depuis une
   heure : aucun cache ne la detient, la lecture est donc toujours fraiche.
   On interroge le creneau courant et ses voisins, on garde la publication la
   plus recente, et on ne revient jamais en arriere.
   Une reponse 404 n'est pas une panne : rien n'a ete publie dans ce creneau. */
var L = { ouvert:false, horsLigne:false, essais:0, recus:0, dernier:"—", erreur:"", src:"", attenteV1:false };
var PERIODE = 20000, PERIODE_CALME = 60000, CLE_CACHE = "popc.data2";
var BASE_RAW = "", SRC_FIXE = null, echecs = 0, cycles = 0, calmes = 0, minuteur = null, vuLe = Date.now();

function instant(maj){
  var m=String(maj||"").match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
  return m ? +(m[3]+m[2]+m[1]+m[4]+m[5]+m[6]) : 0;
}
function heureMaj(maj){
  var m=String(maj||"").match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if(!m) return String(maj||"").split(" ").pop();
  var n=new Date(), auj=(n.getDate()===+m[1] && n.getMonth()+1===+m[2] && n.getFullYear()===+m[3]);
  return (auj?"":m[1]+"/"+m[2]+" ")+m[4]+":"+m[5];
}
function ageMinutes(maj){
  var m=String(maj||"").match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
  if(!m) return null;
  return Math.round((Date.now()-new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]).getTime())/60000);
}
function valide(j){ return j && j.v===2 && Array.isArray(j.equipes) && Array.isArray(j.wods) && Array.isArray(j.vagues) && j.compet && j.apres && j.suspense; }
function attente(){
  return '<header class="entete"><div class="logo">POPC</div><div class="t"><div class="n">Pearl Of Pacific Contest</div><div class="d">Résultats en direct</div></div></header>'+
    '<div class="carte"><div class="vide">'+(L.attenteV1?"La page a été mise à jour. En attente de la prochaine publication des résultats…"
      :(L.erreur?"Connexion impossible pour l'instant. Nouvel essai automatique…":"En attente des premiers résultats…"))+'</div></div>'+
    '<p class="note">page '+VERSION+'</p>';
}
function panneauDiag(){
  var mn=ageMinutes(D.maj), age=(mn===null||mn<0)?"":(mn<1?" (à l'instant)":(mn<90?" (il y a "+mn+" min)":" (il y a "+Math.round(mn/60)+" h)"));
  return '<section class="carte diag"><b>Dernière publication reçue</b><div style="font-size:14px">'+esc(D.maj)+esc(age)+'</div>'+
    (DEMO?'<div>Version d\'essai : données fictives, aucune lecture en ligne.</div>'
      :'<b>Lectures</b><div>'+L.recus+' réussies sur '+L.essais+' · dernière à '+esc(L.dernier)+'</div>'+
       (L.erreur?'<b>Dernière erreur</b><div style="color:var(--warnfg)">'+esc(L.erreur)+'</div>':'')+
       (L.attenteV1?'<div style="color:var(--warnfg)">Un fichier à l\'ancien format a été trouvé : il est ignoré en attendant la prochaine publication.</div>':'')+
       '<b>Source</b><div>'+esc(String(L.src||"—").split("/").slice(-2).join("/"))+'</div>'+
       '<button type="button" data-actualiser="1">Actualiser maintenant</button>')+
    '<div style="color:var(--dim)">Les résultats arrivent à la fin de chaque vague. Entre deux vagues, il est normal que l\'heure ne bouge pas. Page '+esc(VERSION)+'</div></section>';
}
function lotsSources(large){
  if(SRC_FIXE) return [[SRC_FIXE]];
  if(!BASE_RAW) return [["data.json"]];
  var d0=new Date(), s=d0.getMinutes()*3+Math.floor(d0.getSeconds()/20), lots=[];
  function url(d){ return BASE_RAW+"live/s"+((((s+d)%180)+180)%180)+".json"; }
  lots.push(large ? [url(1),url(0),url(-1),url(-2)] : [url(1),url(0),url(-1)]);
  if(large){ for(var d=-3; d>=-18; d-=4) lots.push([url(d),url(d-1),url(d-2),url(d-3)]); }
  lots.push([BASE_RAW+"data.json"]);
  return lots;
}
function lireUne(src){
  var url=src+(src.indexOf("?")<0?"?":"&")+"t="+Date.now()+"."+Math.random().toString(36).slice(2,8);
  return fetch(url,{cache:"no-store"}).then(function(r){
      if(r.status===404){ var v=new Error("rien publié"); v.absent=true; throw v; }
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(j){
      if(j && j.ecrans && !j.v){ var a=new Error("ancien format"); a.ancien=true; throw a; }
      if(!valide(j)) throw new Error("fichier illisible");
      return {src:src, data:j, t:instant(j.maj)};
    }).catch(function(e){ return {src:src, err:(e&&e.message)||"indisponible", absent:!!(e&&e.absent), ancien:!!(e&&e.ancien)}; });
}
/* redessine sans faire perdre la saisie en cours dans la recherche */
function redessiner(){
  var a=document.activeElement, enRecherche=a && a.id==="rech", p=enRecherche?a.selectionStart:0, y=window.scrollY;
  if(location.hash && /^#equipe-/.test(location.hash)) route(); else dessiner();
  window.scrollTo(0,y);
  if(enRecherche){ var r=el("rech"); if(r){ r.focus(); try{ r.setSelectionRange(p,p); }catch(e){} } }
}
function lireSources(large){
  L.essais++;
  var lots=lotsSources(large || !D), toutes=[];
  if(large || !D){ lots.forEach(function(l){ toutes=toutes.concat(l); }); }
  else { cycles++; toutes=(cycles%6===0) ? lots[0].concat(lots[lots.length-1]) : lots[0].slice(); }
  Promise.all(toutes.map(lireUne)).then(function(res){
    var best=null, avant=L.horsLigne+"|"+L.attenteV1+"|"+L.erreur;
    function siChange(){ if(L.ouvert || !D || avant!==(L.horsLigne+"|"+L.attenteV1+"|"+L.erreur)) redessiner(); }
    res.forEach(function(r){ if(r.data && (!best || r.t>best.t)) best=r; });
    L.dernier=new Date().toLocaleTimeString("fr-FR");
    if(!best){
      var joignable=res.some(function(r){ return r.absent || r.ancien; });
      L.attenteV1=!D && res.some(function(r){ return r.ancien; });
      if(joignable){ L.erreur=""; echecs=0; calmes++; L.recus++; L.horsLigne=false; }
      else { L.erreur=(res[0] && res[0].err) || "indisponible"; echecs++; L.horsLigne=true; planifier(); }
      siChange(); return;
    }
    L.recus++; L.erreur=""; L.src=best.src; L.horsLigne=false; L.attenteV1=false; echecs=0;
    var nouveau=!D || best.t>instant(D.maj);
    if(nouveau){
      var premier=!D;
      D=best.data; calmes=0;
      ecrire(CLE_CACHE, JSON.stringify(D));
      if(premier) route(); else redessiner();
      var z=el("app"); if(z){ z.classList.remove("flash"); void z.offsetWidth; z.classList.add("flash"); }
    } else { calmes++; siChange(); }
  });
}
function delaiSuivant(){
  if(echecs>0) return Math.min(PERIODE*Math.pow(2,Math.min(echecs,4)),300000);
  return calmes<90 ? PERIODE : PERIODE_CALME;
}
function planifier(){
  if(minuteur) clearTimeout(minuteur);
  minuteur=setTimeout(function(){ if(!document.hidden){ vuLe=Date.now(); lireSources(false); } planifier(); }, delaiSuivant());
}
function reprendre(){
  if(document.hidden) return;
  var large=(Date.now()-vuLe)>30000; vuLe=Date.now(); calmes=0;
  lireSources(large); planifier();
}

(function(){
  S.fav=lire("popc.fav"); S.cat=lire("popc.cat");
  if(DEMO){
    var d=lire("popc.demo"); charger(JEUX[d]?d:"wod4");
    route(); return;
  }
  var m=location.hostname.match(/^([^.]+)\.github\.io$/);
  if(m){
    var seg=location.pathname.split("/").filter(Boolean);
    BASE_RAW="https://raw.githubusercontent.com/"+m[1]+"/"+(seg.length?seg[0]:m[1]+".github.io")+"/main/";
  }
  var q=location.search.match(/[?&]src=([^&]+)/); if(q) SRC_FIXE=decodeURIComponent(q[1]);
  /* dernier etat connu : la page s'affiche tout de suite, meme sans reseau */
  try{ var c=JSON.parse(lire(CLE_CACHE)||"null"); if(valide(c)){ D=c; L.horsLigne=true; } }catch(e){}
  route();
  lireSources(true); planifier();
  document.addEventListener("visibilitychange", reprendre);
  window.addEventListener("focus", reprendre);
  window.addEventListener("pageshow", reprendre);
  window.addEventListener("online", function(){ lireSources(true); });
})();
</script>
