<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1A30">
<title>Pearl Of Pacific Contest — En direct</title>
<style>
:root{
  --bg:#071324; --bg2:#0B1A30; --panel:#12294A; --panel2:#17325A;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
  --txt:#EAF2FF; --dim:#92A8C9; --dim2:#6D85A8;
  --or:#F28C28; --bleu:#2E75B6; --bleuc:#4D9BE0;
  --gold:#E8B923; --silver:#C5CED6; --bronze:#D08B5B;
  --up:#36C98A; --down:#E8614C;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% 0%,#15305A 0%,var(--bg2) 42%,var(--bg) 100%);
  background-attachment:fixed;
  color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.35;
  padding-bottom:calc(28px + var(--safe));
  overflow-x:hidden;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- en-tete ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(7,19,36,.97) 60%,rgba(7,19,36,.86) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:10px 16px 0;
}
.brand{display:flex;align-items:center;gap:10px}
.mark{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;
  background:linear-gradient(145deg,var(--or),#C96A12);
  display:grid;place-items:center;font-weight:900;font-size:9.5px;letter-spacing:0;color:#1A0E02;
}
.brand h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.3px;line-height:1.1}
.brand .sub{font-size:11.5px;color:var(--dim);margin-top:1px}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);white-space:nowrap;
  background:none;border:0;padding:4px 2px;font-family:inherit;cursor:pointer}
#diag{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:2px 0 9px;font-size:11.5px}
#diag b{display:block;color:var(--dim2);font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-top:7px}
#diag b:first-child{margin-top:0}
#diag .dv{color:var(--txt);word-break:break-all;line-height:1.4;margin-top:2px}
#diag .dh{color:var(--dim2);margin-top:10px;line-height:1.5;border-top:1px solid var(--line);padding-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(54,201,138,.6);animation:pulse 2.4s infinite}
.dot.off{background:var(--dim2);animation:none;box-shadow:none}
.refresh{
  flex:0 0 auto;margin-left:8px;width:34px;height:34px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim);
  display:grid;place-items:center;transition:.15s;-webkit-appearance:none;appearance:none;
}
.refresh:active{background:var(--or);border-color:var(--or);color:#1A0E02}
.refresh.tourne svg{animation:spin .7s ease}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.maj-flash{animation:flash 1.1s ease}
@keyframes flash{0%{background:rgba(54,201,138,.30)}100%{background:transparent}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(54,201,138,.55)}70%{box-shadow:0 0 0 8px rgba(54,201,138,0)}100%{box-shadow:0 0 0 0 rgba(54,201,138,0)}}

nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px 9px}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--dim);font:600 13px/1 inherit;padding:9px 14px;border-radius:999px;cursor:pointer;
  transition:.15s;
}
nav button.on{background:var(--or);border-color:var(--or);color:#1A0E02;font-weight:800}

/* ---------- structure ---------- */
main{padding:14px 14px 0;max-width:620px;margin:0 auto}
section{display:none;animation:fade .25s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.card{
  background:linear-gradient(180deg,var(--panel) 0%,#102343 100%);
  border:1px solid var(--line);border-radius:16px;
  margin-bottom:14px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 26px rgba(0,0,0,.33);
}
.card > h2{
  margin:0;padding:13px 15px 11px;font-size:13px;font-weight:800;
  letter-spacing:.9px;text-transform:uppercase;color:var(--txt);
  border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:8px;
}
.card > h2 .accent{width:3px;height:14px;border-radius:2px;background:var(--or);flex:0 0 3px;align-self:center}
.card > h2 small{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.2px;color:var(--dim);text-transform:none}
.pad{padding:13px 15px}
.note{font-size:11.5px;color:var(--dim2);padding:0 2px 16px;line-height:1.5}

/* ---------- segmented RX / INTER ---------- */
.seg{display:flex;gap:4px;padding:10px 12px;background:rgba(0,0,0,.18);border-bottom:1px solid var(--line)}
.seg button{
  flex:1;border:1px solid transparent;background:transparent;color:var(--dim);
  font:700 12.5px/1 inherit;letter-spacing:.7px;padding:9px 6px;border-radius:9px;cursor:pointer;transition:.15s
}
.seg button.on{background:var(--panel2);border-color:var(--line2);color:var(--txt)}
.seg button.on[data-cat="RX"]{box-shadow:inset 0 -2px 0 var(--or)}
.seg button.on[data-cat="INTER"]{box-shadow:inset 0 -2px 0 var(--bleuc)}
.subt{padding:9px 15px 0;font-size:11.5px;color:var(--dim);letter-spacing:.3px}

/* ---------- lignes de classement ---------- */
.rows{padding:5px 0 9px}
.row{
  display:grid;grid-template-columns:34px 1fr auto;align-items:center;
  gap:10px;padding:8px 15px;border-bottom:1px solid rgba(255,255,255,.045);
}
.row:last-child{border-bottom:0}
.row .rk{
  font:800 15px/1 inherit;text-align:center;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.row.p1 .rk,.row.p2 .rk,.row.p3 .rk{
  width:28px;height:28px;margin:0 3px;border-radius:9px;display:grid;place-items:center;color:#10233E;font-size:14px
}
.row.p1 .rk{background:linear-gradient(145deg,#F6D34A,var(--gold))}
.row.p2 .rk{background:linear-gradient(145deg,#E2E9EF,var(--silver))}
.row.p3 .rk{background:linear-gradient(145deg,#E3A877,var(--bronze))}
.row .nm{font-size:14.5px;font-weight:600;letter-spacing:.1px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{display:flex;align-items:baseline;gap:9px;justify-content:flex-end;white-space:nowrap}
.row .perf{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.row .pts{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.row .gap{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.row.p1 .pts{color:var(--gold)}

/* ---------- vagues ---------- */
.wave{padding:12px 15px;border-bottom:1px solid var(--line)}
.wave:last-child{border-bottom:0}
.wave .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.1px;color:var(--or)}
.wave.w2 .lbl{color:var(--bleuc)}
.wave.w3 .lbl{color:var(--dim)}
.wave .when{font-size:13.5px;font-weight:700;margin:3px 0 9px}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lane{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;min-width:0}
.lane b{font-size:10px;font-weight:800;color:var(--dim2);flex:0 0 auto}
.lane span{font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}

/* ---------- descriptif WOD ---------- */
.wodhead{padding:14px 15px 0}
.wodhead .t{font-size:19px;font-weight:800;letter-spacing:.2px}
.wodhead .s{font-size:12.5px;color:var(--dim);margin-top:4px}
.wodbox{margin:12px 15px 15px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.wodbox .cat{padding:9px 13px;font:800 12px/1.3 inherit;letter-spacing:1px}
.wodbox.rx .cat{background:rgba(242,140,40,.17);color:#FFC489;border-bottom:1px solid rgba(242,140,40,.3)}
.wodbox.inter .cat{background:rgba(77,155,224,.15);color:#A9D2F6;border-bottom:1px solid rgba(77,155,224,.3)}
.wodbox pre{
  margin:0;padding:13px;font:400 14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.2);color:#DCE8F8
}

/* ---------- tableau indicateurs / faits ---------- */
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:4px 0 10px}
.kv .k{padding:9px 15px 2px;font-size:11.5px;color:var(--dim2);grid-column:1/-1;letter-spacing:.3px}
.kv .v{display:grid;grid-template-columns:38px 1fr;gap:9px;align-items:baseline;padding:2px 15px 7px;grid-column:1/-1}
.kv .v b{font-size:10px;font-weight:800;letter-spacing:.8px}
.kv .v.rx b{color:var(--or)} .kv .v.it b{color:var(--bleuc)}
.kv .v span{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}

/* ---------- evolution ---------- */
.evo{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 15px;border-bottom:1px solid rgba(255,255,255,.045)}
.evo:last-child{border-bottom:0}
.evo .rk{font:800 14px/1 inherit;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.evo .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evo .trk{display:flex;align-items:center;gap:3px;margin-top:4px;flex-wrap:wrap}
.evo .trk i{
  font-style:normal;font-size:10.5px;font-weight:700;color:var(--dim);
  background:rgba(255,255,255,.07);border-radius:5px;padding:2px 5px;min-width:19px;text-align:center;
  font-variant-numeric:tabular-nums
}
.evo .trk i.last{background:rgba(242,140,40,.22);color:#FFC489}
.evo .trk em{font-style:normal;color:var(--dim2);font-size:9px}
.delta{font:800 13px/1 inherit;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.u{color:var(--up)} .delta.d{color:var(--down)} .delta.e{color:var(--dim2)}
.best{display:flex;align-items:center;gap:10px;padding:12px 15px;background:rgba(54,201,138,.08);border-top:1px solid var(--line)}
.best .l{font-size:10px;font-weight:800;letter-spacing:.9px;color:var(--dim)}
.best .v{font-size:14px;font-weight:700;margin-top:2px}

/* ---------- ordre de passage ---------- */
.wsel{display:flex;gap:7px;overflow-x:auto;padding:11px 15px 12px;border-bottom:1px solid var(--line);
      -webkit-overflow-scrolling:touch;scrollbar-width:none}
.wsel::-webkit-scrollbar{display:none}
.wsel button{
  flex:0 0 auto;background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--dim);
  font:700 12.5px/1 inherit;padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:.15s
}
.wsel button.on{background:var(--or);border-color:var(--or);color:#17120A}
.pstate{padding:10px 15px;font-size:12px;color:var(--dim);display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.pstate b{color:var(--txt);font-size:13px;font-weight:700}
.pstate .prov{color:#F0B860}
.vg{border-top:1px solid var(--line)}
.vg:first-of-type{border-top:0}
.vg-h{display:flex;align-items:center;gap:8px;padding:10px 15px 8px;flex-wrap:wrap}
.vg-h .t{font-size:14px;font-weight:800;letter-spacing:.2px}
.vg-h .b{font-size:9.5px;font-weight:800;letter-spacing:.9px;padding:3px 7px;border-radius:5px}
.vg-h .b.rx{background:rgba(242,140,40,.2);color:#FFC489}
.vg-h .b.it{background:rgba(94,160,255,.18);color:#A8CCFF}
.vg-h .hr{margin-left:auto;font-size:14px;font-weight:800;color:var(--or);font-variant-numeric:tabular-nums}
.vg-h .st{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--dim2);
          border:1px solid var(--line2);border-radius:999px;padding:2px 8px}
.vg.encours{background:rgba(54,201,138,.06)}
.vg.encours .st{color:var(--up);border-color:rgba(54,201,138,.45)}
.vg.finie .vg-h .t,.vg.finie .vg-h .hr{opacity:.55}
.vg-c{padding:0 15px 11px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cl{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.045);
    border-radius:8px;padding:8px 10px;min-width:0}
.cl .n{flex:0 0 auto;width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.1);
       color:var(--dim);font:800 10px/18px inherit;text-align:center}
/* le nom doit etre lisible en entier : on passe a la ligne plutot que de couper */
.cl .e{font-size:12.5px;font-weight:600;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.cl.vide{opacity:.35}
@media (max-width:360px){ .vg-c{grid-template-columns:1fr} }

/* ---------- divers ---------- */
.empty{padding:26px 15px;text-align:center;color:var(--dim2);font-size:13.5px}
.lines{padding:4px 15px 14px}
.lines div{font-size:13.5px;color:#CFE0F5;padding:3px 0}
.lines div:first-child{font-size:16px;font-weight:800;color:var(--txt);padding-bottom:5px}
footer{text-align:center;color:var(--dim2);font-size:11px;padding:6px 16px 22px;line-height:1.6}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe));
  background:#1C3157;border:1px solid var(--line2);color:var(--txt);
  font-size:12.5px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:40;
  box-shadow:0 8px 24px rgba(0,0,0,.4)
}
#toast.on{opacity:1}
@media (min-width:560px){
  .row .nm{font-size:15.5px}
  .lanes{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">POPC</div>
    <div>
      <h1 id="hTitre">PEARL OF PACIFIC CONTEST</h1>
      <div class="sub" id="hDates">—</div>
    </div>
    <button class="live" id="hLive" title="Détails techniques"><span class="dot" id="hDot"></span><span id="hMaj">chargement…</span></button>
    <button class="refresh" id="hRefresh" title="Actualiser maintenant" aria-label="Actualiser">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>
  <div id="diag" hidden></div>
  <nav id="nav">
    <button data-v="live" class="on">En direct</button>
    <button data-v="wod">Le WOD</button>
    <button data-v="resultats">Résultats</button>
    <button data-v="palmares">Palmarès</button>
    <button data-v="journees">Journées</button>
    <button data-v="evolution">Évolution</button>
    <button data-v="passage">Passage</button>
  </nav>
</header>

<main id="main-zone">
  <section id="v-live" class="on"></section>
  <section id="v-wod"></section>
  <section id="v-resultats"></section>
  <section id="v-palmares"></section>
  <section id="v-journees"></section>
  <section id="v-evolution"></section>
  <section id="v-passage"></section>
</main>

<footer>
  Mise à jour automatique toutes les 20&nbsp;secondes.<br>
  Classements officiels&nbsp;: tableau d'affichage de la compétition.
</footer>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   PEARL OF PACIFIC CONTEST — page spectateurs
   Lit data.json (genere par la macro Excel ExportWeb) et remet
   en page les 6 ecrans du classeur au format telephone.
   ============================================================ */

/* ------------------------------------------------------------------
   REGLAGES — les deux seules lignes a modifier si besoin.

   SRC : ou la page va chercher les resultats.
         "data.json"  = le fichier depose a cote de cette page (par defaut).
         Pour un affichage plus rapide, on peut mettre l'adresse directe
         du fichier dans le depot, par exemple :
         "https://raw.githubusercontent.com/MON-COMPTE/popc-live/main/data.json"
   PERIODE : delai entre deux mises a jour, en millisecondes.
   ------------------------------------------------------------------ */
var SRC      = "data.json";
var PERIODE  = 15000;

/* --- choix automatique de la source ---------------------------------
   Sur GitHub Pages, le site est reconstruit a chaque envoi : le fichier
   data.json servi par le site peut avoir plusieurs minutes de retard.
   On lit donc directement le fichier du depot (raw.githubusercontent),
   qui est mis a jour immediatement, en deduisant le compte et le depot
   de l'adresse de la page. Si cette lecture echoue, on retombe tout
   seul sur le data.json pose a cote de la page.
   -------------------------------------------------------------------- */
var BASE_RAW = "";          /* .../main/  dans le depot, si on est sur github.io */
var SRC_FIXE = null;        /* source imposee par ?src= */

(function(){
  var m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if(m){
    var compte = m[1];
    var seg = location.pathname.split("/").filter(Boolean);
    var depot = seg.length ? seg[0] : compte + ".github.io";
    BASE_RAW = "https://raw.githubusercontent.com/"+compte+"/"+depot+"/main/";
  }
  var q = location.search.match(/[?&]src=([^&]+)/);
  if(q) SRC_FIXE = decodeURIComponent(q[1]);
})();

/* --- creneaux de 20 secondes -----------------------------------------
   Les hebergeurs de fichiers gardent chaque adresse en cache plusieurs
   minutes. Excel ecrit donc aussi sous un nom qui change toutes les 20 s
   (live/s0.json a live/s179.json, un cycle d'une heure) : cette adresse-la
   n'a pas servi depuis une heure, aucun cache ne la detient, la lecture est
   donc toujours fraiche. On interroge le creneau courant et ses voisins,
   ce qui absorbe un ecart d'horloge entre le telephone et le poste de saisie.
   -------------------------------------------------------------------- */
function creneau(d){ return d.getMinutes()*3 + Math.floor(d.getSeconds()/20); }

function lotsSources(large){
  if(SRC_FIXE) return [[SRC_FIXE]];
  if(!BASE_RAW) return [["data.json"]];

  var s = creneau(new Date()), lots = [];
  function url(d){ return BASE_RAW + "live/s" + ((((s+d)%180)+180)%180) + ".json"; }

  lots.push([url(1), url(0), url(-1), url(-2)]);        /* ~80 dernieres secondes */
  if(large){
    for(var d=-3; d>=-18; d-=4){                        /* jusqu'a ~6 minutes */
      lots.push([url(d), url(d-1), url(d-2), url(d-3)]);
    }
  }
  lots.push([BASE_RAW + "data.json"]);                  /* filet */
  return lots;
}


var D = null;                 // dernier jeu de donnees valide
var vue = "live";
var cat = { live:"RX", resultats:"RX", journees:"RX", evolution:"RX", palmares:"RX" };
var echecs = 0;

/* ---------- acces aux cellules : c(ecran, ligne Excel, colonne Excel) ---------- */
function c(e,r,col){
  try{
    var g = D.ecrans[e];
    if(!g || !g[r-1]) return "";
    var v = g[r-1][col-1];
    return (v===undefined||v===null) ? "" : String(v).trim();
  }catch(_){ return ""; }
}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];
  });
}
function el(id){ return document.getElementById(id); }

/* ---------- briques d'affichage ---------- */
function carte(titre,corps,petit){
  if(!corps) return "";
  return '<div class="card"><h2><span class="accent"></span>'+esc(titre)+
         (petit?'<small>'+esc(petit)+'</small>':'')+'</h2>'+corps+'</div>';
}
function segment(nom,sstRX,sstINT){
  var a = cat[nom];
  /* pendant le WOD 1 (qualif) il n'y a pas encore de categories */
  var qualif = /QUALIF/i.test(sstRX||"") && /QUALIF/i.test(sstINT||"");
  var l1 = qualif ? "Places 1 à 16" : "RX";
  var l2 = qualif ? "Places 17 et +" : "INTER";
  return '<div class="seg" data-seg="'+nom+'">'+
    '<button data-cat="RX" class="'+(a==="RX"?"on":"")+'">'+l1+'</button>'+
    '<button data-cat="INTER" class="'+(a==="INTER"?"on":"")+'">'+l2+'</button>'+
    '</div>'+
    '<div class="subt">'+esc(a==="RX"?sstRX:sstINT)+'</div>';
}
/* vrai si le bloc de lignes rendu est vide */
function vide(html){ return /class="empty"/.test(html); }
/* une ligne de classement */
function ligne(rk,nom,perf,pts,gap){
  if(!nom) return "";
  var p = parseInt(rk,10);
  var cls = (p===1?"p1":p===2?"p2":p===3?"p3":"");
  var droite = "";
  if(perf) droite += '<span class="perf">'+esc(perf)+'</span>';
  if(pts!=="" && pts!==undefined) droite += '<span class="pts">'+esc(pts)+'</span>';
  if(gap) droite += '<span class="gap">'+esc(gap)+'</span>';
  return '<div class="row '+cls+'"><div class="rk">'+esc(rk)+'</div>'+
         '<div class="nm">'+esc(nom)+'</div><div class="rt">'+droite+'</div></div>';
}
/* bloc de lignes : cols = [colRang, colNom, colPerf|0, colPts, colSuffixe|0]
   mode : "ecart" -> affiche "-12" ; "gen" -> affiche "gen. 3" ; sinon brut */
function tableau(ecran,cols,r1,r2,mode){
  var h="",n=0;
  for(var r=(r1||8); r<=(r2||23); r++){
    var nom = c(ecran,r,cols[1]); if(!nom) continue;
    var perf = cols[2]? c(ecran,r,cols[2]) : "";
    var pts  = cols[3]? c(ecran,r,cols[3]) : "";
    var gap  = cols[4]? c(ecran,r,cols[4]) : "";
    if(gap){
      if(mode==="ecart") gap = (gap==="0"||gap==="—") ? "" : "−"+gap;
      else if(mode==="gen") gap = "gén. "+gap;
    }
    h += ligne(c(ecran,r,cols[0]),nom,perf,pts,gap); n++;
  }
  return n? '<div class="rows">'+h+'</div>' : '<div class="empty">Pas encore de résultat.</div>';
}
/* nettoie un libelle Excel : coupe sur 2 espaces, retire les separateurs isoles */
function morceaux(txt){
  return String(txt||"").split(/\s{2,}/)
    .map(function(s){return s.trim();})
    .filter(function(s){ return s && !/^[—·\-|]+$/.test(s); });
}
/* decoupe "C1  EQUIPE A     C2  EQUIPE B" en couloirs */
function couloirs(txt){
  if(!txt) return [];
  var t = txt.split(/\s{2,}/).map(function(s){return s.trim();}).filter(Boolean);
  var out=[], i=0;
  while(i<t.length){
    if(/^C\d$/i.test(t[i])){ out.push([t[i], t[i+1]||""]); i+=2; }
    else { out.push(["", t[i]]); i+=1; }
  }
  return out;
}
/* bloc "libelle / valeur RX / valeur INTER", lignes vides ignorees */
function blocKV(e,r1,r2){
  var k="",n=0;
  for(var r=r1;r<=r2;r++){
    var lib=c(e,r,12); if(!lib) continue;
    var vr=c(e,r,14), vi=c(e,r,18);
    if((!vr||vr==="—") && (!vi||vi==="—")) continue;   // rien a montrer encore
    k += '<div class="k">'+esc(lib)+'</div>'+
         '<div class="v rx"><b>RX</b><span>'+esc(vr||"—")+'</span></div>'+
         '<div class="v it"><b>INTER</b><span>'+esc(vi||"—")+'</span></div>';
    n++;
  }
  return n? '<div class="kv">'+k+'</div>' : "";
}
function blocVague(lbl,quand,paires,rang){
  if(!lbl && !quand) return "";
  if((!quand || quand==="—") && !paires.length) return "";   // plus rien a venir
  var l="";
  for(var i=0;i<paires.length;i++){
    if(!paires[i][1]) continue;
    l += '<div class="lane"><b>'+esc(paires[i][0]||("C"+(i+1)))+'</b><span>'+esc(paires[i][1])+'</span></div>';
  }
  return '<div class="wave w'+(rang||1)+'"><div class="lbl">'+esc(lbl)+'</div>'+
         '<div class="when">'+esc(quand||"—")+'</div>'+
         (l?'<div class="lanes">'+l+'</div>':'')+'</div>';
}

/* 6 blocs empiles dans la feuille : WOD 1 a 6, titre en ligne 4, 15, 26, 37, 48, 59 */
var P_BLOCS = [4,15,26,37,48,59];
var wodSel = -1;                       /* -1 = choix automatique */

/* blocs reellement remplis, dans l'ordre */
function passageBlocs(){
  var t=[];
  for(var i=0;i<P_BLOCS.length;i++){
    var L=P_BLOCS[i], nom=c("passage",L,1);
    if(!nom) continue;
    var vagues=0;
    for(var k=0;k<8;k++){ if(c("passage",L+2+k,1)) vagues++; }
    if(vagues) t.push({ligne:L, nom:nom, jour:c("passage",L,2),
                       debut:c("passage",L,3), etat:c("passage",L,4), n:vagues});
  }
  return t;
}
function passageDispo(){ return passageBlocs().length>0; }

/* "Vague 3 INTER" -> ["Vague 3","INTER"] */
function coupeVague(nom){
  var m=String(nom).match(/^(.*?)\s+(RX|INTER)$/i);
  return m ? [m[1], m[2].toUpperCase()] : [nom, ""];
}

  for(var i=0;i<blocs.length;i++){ if(blocs[i].ligne===wodSel){ idx=i; break; } }

  var corps="";

    var p=coupeVague(nom), heure=c("passage",r,2), st=c("passage",r,3);
    var cls = st==="En cours" ? " encours" : (st==="Terminée" ? " finie" : "");
    var badge = p[1] ? '<span class="b '+(p[1]==="RX"?"rx":"it")+'">'+p[1]+'</span>' : "";

             '<span class="e">'+esc(eq||"—")+'</span></div>';
    }
    corps += '<div class="vg'+cls+'"><div class="vg-h"><span class="t">'+esc(p[0])+'</span>'+
             badge+(heure?'<span class="hr">'+esc(heure)+'</span>':"")+
             (st?'<span class="st">'+esc(st)+'</span>':"")+'</div>'+
             '<div class="vg-c">'+cou+'</div></div>';
  }

  el("v-passage").innerHTML =
    carte("Ordre de passage", onglets+tete+corps) +
    '<div class="note">Les numéros indiquent le couloir. Les horaires sont indicatifs ' +

var diag = {src:"", essais:0, recus:0, dernier:"—", derniereMaj:"—", erreur:"",
            inchange:0, detail:[]};

/* "13/10/2026 13:22:37" -> nombre comparable */
function instant(maj){
  var m = String(maj||"").match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
  if(!m) return 0;
  return +(m[3]+m[2]+m[1]+m[4]+m[5]+m[6]);
}

function lireUne(src){
  var url = src + (src.indexOf("?")<0?"?":"&") + "t=" + Date.now()
          + "." + Math.random().toString(36).slice(2,8);
  return fetch(url,{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){
      if(!j || !j.ecrans) throw new Error("fichier illisible");
      return {src:src, data:j, t:instant(j.maj)};
    })
    .catch(function(e){ return {src:src, err:(e&&e.message)||"indisponible"}; });
}

/* Interroge toutes les sources et retient la plus recente : ni le cache du site
   ni celui du depot ne peut plus faire reculer l'affichage. */
function charger(manuel){
  diag.essais++;
  var large = manuel || !D;
  var lots = lotsSources(large), toutes = [];

  if(large){
    /* Un fichier de creneau se recycle toutes les heures : il peut donc
       contenir des donnees vieilles d'une heure. En recherche large on lit
       tout et on garde la version la plus recente, jamais la premiere. */
    lots.forEach(function(l){ toutes = toutes.concat(l); });
  } else {
    toutes = lots[0].concat(lots[lots.length-1]);
  }

  Promise.all(toutes.map(lireUne)).then(function(res){
    var best = null;
    diag.interroges = res.length;
    diag.detail = res.filter(function(r){ return r.data; }).map(function(r){
      return { src:r.src.split("/").slice(-1)[0].split("?")[0], maj:r.data.maj, err:"" };
    });
    if(!diag.detail.length && res.length){
      diag.detail = [{ src:res[0].src.split("/").slice(-1)[0], maj:null, err:res[0].err||"aucune réponse" }];
    }
    for(var i=0;i<res.length;i++){
      if(res[i].data && (!best || res[i].t > best.t)) best = res[i];
    }
    if(!best){
      diag.erreur = res[0].err || "indisponible";
      echecs++; majEtat(false); majDiag();
      if(!D) el("v-"+vue).innerHTML =
        '<div class="card"><div class="empty">En attente des premiers résultats…</div></div>';
      if(manuel) toast("Connexion impossible");
      return;
    }
    diag.recus++; diag.erreur = ""; diag.src = best.src;
    diag.dernier = new Date().toLocaleTimeString("fr-FR");
    if(D && D.maj === best.data.maj) diag.inchange++; else diag.inchange = 0;
    diag.derniereMaj = best.data.maj || "—";
    /* ne jamais revenir en arriere si un cache ressort une vieille copie */
    var nouveau = !D || instant(best.data.maj) > instant(D.maj);
    if(!D || instant(best.data.maj) >= instant(D.maj)){
      D = best.data; dessiner();
    }
    echecs=0; majEtat(true); majDiag();
    if(nouveau){
      var m = el("main-zone"); if(m){ m.classList.remove("maj-flash"); void m.offsetWidth; m.classList.add("maj-flash"); }
      if(manuel) toast("Classements mis à jour");
    } else if(manuel){
      toast("Déjà à jour");
    }
  });
}

/* ---- panneau de diagnostic : appui long ou clic sur l'indicateur ---- */
/* ecart en minutes entre une date "jj/mm/aaaa hh:mm:ss" et maintenant */
function ageMinutes(maj){
  var m = String(maj||"").match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
  if(!m) return null;
  var d = new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +m[6]);
  var mn = Math.round((Date.now() - d.getTime())/60000);
  return (mn < -5 || mn > 600) ? null : Math.max(0, mn);
}

function majDiag(){
  var p = el("diag"); if(!p || p.hidden) return;

  /* age de la donnee affichee */
  var age = "", cls = "var(--up)", mn = ageMinutes(diag.derniereMaj);
  if(mn !== null){
    age = mn < 1 ? "à l'instant" : ("il y a " + mn + " min");
    if(mn >= 10) cls = "var(--or)";
    if(mn >= 30) cls = "var(--down)";
  }

  /* d'ou vient la donnee retenue */
  var via = /^s\d+\.json/.test(String(diag.src).split("/").slice(-1)[0] || "")
            ? "fichier de créneau (le plus rapide)" : "fichier principal";

  p.innerHTML =
    '<b>Dernière publication reçue</b>'+
    '<div class="dv" style="font-size:14px">'+esc(diag.derniereMaj)+
      (age?' <span style="color:'+cls+'">· '+esc(age)+'</span>':'')+'</div>'+
    '<b>Reçue par</b><div class="dv">'+esc(via)+'</div>'+
    '<b>Lectures</b><div class="dv">'+diag.recus+' réussies sur '+diag.essais+
      '  ·  dernière à '+esc(diag.dernier)+'</div>'+
    (diag.erreur?'<b>Dernière erreur</b><div class="dv" style="color:var(--down)">'+esc(diag.erreur)+'</div>':'')+
    '<div class="dh">Comparez l\'heure ci-dessus avec la ligne « Dernière publication » '+
    'du classeur : si les deux correspondent, toute la chaîne fonctionne.</div>';
}

function allerA(nom){
  vue=nom;
  [].forEach.call(el("nav").children,function(x){ x.classList.toggle("on",x.dataset.v===nom); });
  [].forEach.call(document.querySelectorAll("main section"),function(s){
    s.classList.toggle("on", s.id==="v-"+nom);
  });
  dessiner();
}

el("nav").addEventListener("click",function(ev){
  var b=ev.target.closest("button"); if(!b) return;
  allerA(b.dataset.v);
  window.scrollTo({top:0,behavior:"smooth"});
});

/* panneau de diagnostic */
el("hLive").addEventListener("click",function(){

/* bouton Actualiser : lecture immediate, sans attendre le cycle */
el("hRefresh").addEventListener("click",function(ev){
  ev.stopPropagation();
  this.classList.add("tourne");
  var b=this;
  setTimeout(function(){ b.classList.remove("tourne"); }, 700);
  charger(true);
});

/* tirer vers le bas pour actualiser (telephone) */
(function(){
  var y0=null;
  document.addEventListener("touchstart",function(e){
    y0 = (window.scrollY<=0 && e.touches.length===1) ? e.touches[0].clientY : null;
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(y0===null) return;
    if(e.touches[0].clientY - y0 > 70){ y0=null; charger(true); }
  },{passive:true});
  document.addEventListener("touchend",function(){ y0=null; },{passive:true});
})();

/* cycle de vie
   En veille, le telephone gele les minuteurs : au reveil, la derniere
   publication peut dater de plusieurs minutes et sortir de la fenetre
   courte lue en fond. On fait donc une recherche LARGE a chaque retour
   a l'ecran, et une lecture courte pendant que la page est visible. */
var vuLe = Date.now();

function reprendre(){
  if(document.hidden) return;
  /* absence de plus de 30 s -> recherche large, sinon lecture normale */
  var large = (Date.now() - vuLe) > 30000;
  vuLe = Date.now();
  charger(large);
}

charger(true);                       /* premier affichage : recherche large */
var boucle = setInterval(function(){
  if(document.hidden) return;
  vuLe = Date.now();
  charger(false);
}, PERIODE);
document.addEventListener("visibilitychange", reprendre);
window.addEventListener("focus", reprendre);
window.addEventListener("pageshow", reprendre);
window.addEventListener("online", function(){ charger(true); });
